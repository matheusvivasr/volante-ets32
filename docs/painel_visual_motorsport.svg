<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<title>Console a 60 graus com volante preto e cluster de luzes alinhado</title>
<desc>Console unico a 60 graus. Volante preto de 35 cm no eixo central. A esquerda, cluster de instrumentos: barra de RPM sobre o display GC9A01, setas verdes flanqueando o mostrador e farois baixo (verde) e alto (azul) em linha abaixo. Pisca-alerta vermelho acima da botoeira, a direita. Pedais a frente. Legenda na base.</desc>
