<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<title>Diagrama de ligações posicionado como o cockpit</title>
<desc>Ligacoes do volante DIY arranjadas como o cockpit: estacao painel a esquerda (ESP32-C3, GC9A01, LEDs, reles), nucleo ESP32-S3 ao centro com o sensor AS5047P por SPI e os pedais, estacao botoeira a direita (ESP32-C3, botoes, joystick), e na base o PC por USB e a fonte/buck 5V. UART entre as placas, numeracao cruzando com LIGACOES.md.</desc>
