<text x="340" y="56" font-size="11" fill="#6b7480" text-anchor="middle">núcleo · centro (eixo do volante)</text>
<text x="550" y="136" font-size="11" fill="#6b7480" text-anchor="middle">estação botoeira · direita</text>

